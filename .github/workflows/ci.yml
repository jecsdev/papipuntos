name: CI

on:
  push:
    branches: [ master, "feature/**" ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the still-running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KTLINT_VERSION: "1.5.0"
  DETEKT_VERSION: "1.23.8"

jobs:
  # Compiles the whole Android side (app + shared + core + features) and runs the JVM host tests.
  # The iOS unit tests are auto-disabled on a Linux host, so allTests just skips them here.
  android:
    name: Android build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble + unit tests
        run: ./gradlew assembleDebug allTests --stacktrace

  # The only cross-check that the Kotlin/Native iOS targets still compile. Needs a macOS runner
  # (Xcode toolchain); compile-only, no simulator boot.
  ios:
    name: iOS compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile iOS target
        run: ./gradlew compileKotlinIosSimulatorArm64 --stacktrace

  # Style (ktlint) + code smells (detekt). Run as standalone CLIs so they stay decoupled from the
  # Gradle 9.1 build. Config lives in .editorconfig (ktlint) and config/detekt/detekt.yml.
  lint:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ktlint (formatting)
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint --relative "**/src/**/*.kt"

      - name: detekt (code smells)
        run: |
          curl -sSLO "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          java -jar "detekt-cli-${DETEKT_VERSION}-all.jar" \
            --input . \
            --config config/detekt/detekt.yml \
            --excludes "**/build/**,**/.gradle/**"
