name: CI

on:
  push:
    branches: [ master, "feature/**" ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the still-running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KTLINT_VERSION: "1.5.0"
  DETEKT_VERSION: "1.23.8"

jobs:
  # Compiles the whole Android side (app + shared + core + features) and runs the JVM host tests.
  # The iOS unit tests are auto-disabled on a Linux host, so allTests just skips them here.
  android:
    name: Android build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble + unit tests
        run: ./gradlew assembleDebug allTests --stacktrace

  # Xcode builds the simulator app and invokes Gradle to link the shared Kotlin framework.
  ios:
    name: iOS simulator app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release ARM64 simulator app
        env:
          # Match the Xcode SDK supported by Kotlin 2.4.0.
          DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/papipuntos-ios"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            "CONFIGURATION_BUILD_DIR=$build_dir" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

          app_binary="$build_dir/Papipuntos.app/Papipuntos"
          test -x "$app_binary"
          xcrun otool -l "$app_binary" > "$build_dir/macho-load-commands.txt"
          if grep -Eq '^[[:space:]]*segname[[:space:]]+__DWARF$' "$build_dir/macho-load-commands.txt"; then
            echo "::error::Release executable contains embedded DWARF debug information."
            exit 1
          fi

          ditto -c -k --keepParent "$build_dir/Papipuntos.app" \
            "$RUNNER_TEMP/Papipuntos.app.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Papipuntos.app.zip
          archive: false
          if-no-files-found: error

  # Style (ktlint) + code smells (detekt). Run as standalone CLIs so they stay decoupled from the
  # Gradle 9.1 build. Config lives in .editorconfig (ktlint) and config/detekt/detekt.yml.
  lint:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: ktlint (formatting)
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint --relative "**/src/**/*.kt"

      - name: detekt (code smells)
        run: |
          curl -sSLO "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          java -jar "detekt-cli-${DETEKT_VERSION}-all.jar" \
            --input . \
            --config config/detekt/detekt.yml \
            --excludes "**/build/**,**/.gradle/**"
